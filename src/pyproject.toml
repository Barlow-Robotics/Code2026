#
# This controls what RobotPy packages are installed on the RoboRIO
# (the host/sim dependencies are in the root pyproject.toml)
#

[tool.robotpy]

# Version of robotpy this project depends on
robotpy_version = "2026.2.1.1"

# Which optional robotpy components should be installed?
# -> equivalent to `pip install robotpy[extra1, ...]
components = [
    #"all",
    # "apriltag",
    "commands2",
    #"pathplannerlib",
    # "cscore",
    # "romi",
    # "sim",
    # "xrp",
]

dependencies = [
    "robotpy-pykit==1.0.3",
    "robotpy-pykit-watch==1.0.0",
    "robotpy-halsim-gui>=2026.1.1",
    "robotpy-cli>=2026.0.1",
    "black>=25.9.8",
    "pylint>=4.0.2",
    "robotpy-pathplannerlib>=2026.1.1",
]


# Other pip packages to install, such as vendor packages (each element
# is equivalent to a line in requirements.txt)
requires = ["numpy", "phoenix6", "photonlibpy"]



